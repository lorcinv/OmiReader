name: 功能建议 / Feature request
description: 提出使用场景和改进建议 / Suggest an improvement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / Use case
      description: 你希望完成什么？现在遇到什么困难？ / What would you like to do, and what makes it difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议 / Proposal
